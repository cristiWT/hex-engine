name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check the code
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DHEX_SANITIZE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cmake --test-dir build --output-on-failure